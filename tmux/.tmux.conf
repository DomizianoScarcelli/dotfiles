set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

# --- Catppuccin Mocha Color Palette ---
# Background: #1e1e2e
# Surface0:   #313244
# Lavender:   #b4befe
# Peach:      #fab387
# Green:      #a6e3a1
# Sky:        #89dceb

# --- General UI Setup ---
set -g status-position bottom
set -g status-justify left
set -g status-style 'bg=default' # Transparent background for the "island" effect

# --- Pane Aesthetics (The Borders) ---
set -g pane-border-style 'fg=#313244' 
set -g pane-active-border-style 'fg=#b4befe' # Lavender active border

# --- Left Island: Session Name ---
set -g status-left-length 100
set -g status-left "#[fg=#b4befe,bg=default]#[fg=#11111b,bg=#b4befe,bold]󱫋 #S#[fg=#b4befe,bg=default] "

# --- Right Island: Time ---
set -g status-right-length 50
set -g status-right "#[fg=#a6e3a1,bg=default]#[fg=#11111b,bg=#a6e3a1,bold]󱑒 %H:%M#[fg=#a6e3a1,bg=default]"

# --- Middle Island: Windows ---
set -g window-status-separator " " # Thin gap between window pills

# Inactive Window (Surface0 color)
set -g window-status-format "#[fg=#313244,bg=default]#[fg=#cdd6f4,bg=#313244]#I:#W#[fg=#313244,bg=default]"

# Active Window (Peach color)
set -g window-status-current-format "#[fg=#fab387,bg=default]#[fg=#11111b,bg=#fab387,bold]#I:#W#[fg=#fab387,bg=default]"

# Command prompt / Message styles
set -g message-style 'fg=#fab387 bg=#1e1e2e bold'


# Enable automatic renaming of windows
set -g automatic-rename on

# Format: [Icon] Process | Folder 
# #{b:pane_current_path} gives just the "basename" of the folder (e.g., "my-repo" instead of "/users/name/dev/my-repo")
set -g automatic-rename-format "#{?#{==:#{pane_current_command},zsh},󰉋 #{b:pane_current_path}, #{pane_current_command} | #{b:pane_current_path}}"

